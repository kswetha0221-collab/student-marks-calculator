<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Student Marks Calculator</h1>
      <p class="subtitle">Enter marks for five subjects to calculate your result.</p>
      <form id="marksForm">
        <label for="studentName">Student name</label>
        <input id="studentName" type="text" placeholder="Enter your name" required>

        <div class="subjects">
          <div><label for="subject1">Subject 1</label><input id="subject1" type="number" min="0" max="100" placeholder="0–100" required></div>
          <div><label for="subject2">Subject 2</label><input id="subject2" type="number" min="0" max="100" placeholder="0–100" required></div>
          <div><label for="subject3">Subject 3</label><input id="subject3" type="number" min="0" max="100" placeholder="0–100" required></div>
          <div><label for="subject4">Subject 4</label><input id="subject4" type="number" min="0" max="100" placeholder="0–100" required></div>
          <div><label for="subject5">Subject 5</label><input id="subject5" type="number" min="0" max="100" placeholder="0–100" required></div>
        </div>
        <button type="submit">Calculate Result</button>
        <button type="reset" class="reset">Clear</button>
      </form>
      <section id="result" class="result" aria-live="polite" hidden></section>
      <p class="note">Each subject is out of 100 marks. This is a practice project.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
